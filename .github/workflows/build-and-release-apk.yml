name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "ClipVault v1.0.5 - 12-Hour AM/PM Timestamps, Search LTR Fix, URL Accent, Date Filter & Theme Switch"
          body: |
            ### 🚀 ClipVault v1.0.5 Release

            Key functional fixes and advanced features implemented in this build:
            - **1. Search Bar Layout & Typing Fix:** Resolved text jump/reversed character layout by decoupling the UI input state from asynchronous updates and strictly enforcing `TextDirection.Ltr` and `TextAlign.Start`.
            - **2. Smart Duplicate Detection:** Prevented duplicate rows in the Room database. Existing clips have their timestamps refreshed so they bump to the top without fragmenting history.
            - **3. Smart Auto-Classification & Electric Cyan URL Accent:** Pre-compiled Regex patterns automatically classify URLs, Emails, Phone numbers, and Code snippets. URLs now render with an eye-catching electric cyan border (`#0284C7`), custom pill badge, and 1-tap "Open Link" action button.
            - **4. Quick Clip Editing & Date-Picker Filter:** Added an inline quick-edit modal for existing clips and a native Material calendar date filter to review clips saved on any past date.
            - **5. 12-Hour AM/PM Timestamps:** Upgraded all clip cards and vault records to the user-friendly 12-hour format (`MMM d, h:mm a` -> e.g., `Nov 9, 6:04 PM`).
            - **6. Complete History Wipe Bug Fix:** Enhanced `Clear All History` to cleanly purge all stored unpinned clips and simultaneously reset all active search queries, category selections, and date filters without orphan entries.
            - **7. Dark / Light (White) Theme Switcher & Quick Access Guide:** Added seamless System/Light/Dark switching in Settings and a comprehensive Quick Access guide for notification bar actions and Quick Settings tiles.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
