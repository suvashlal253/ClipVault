name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests & Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.6.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.5.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.4.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.3.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6.0
          name: "ClipVault v1.6.0 - Bilingual English + বাংলা (Bangla Phonetic) Keyboard, Real-Time Transliteration & Smart Suggestions"
          body: |
            ### 🚀 ClipVault v1.6.0 Release (Build 29)

            Complete Bilingual English + বাংলা (Bangla Phonetic) Keyboard Upgrade:
            - **1. Modular Bengali Phonetic Transliteration Engine (`com.clipvault.android.keyboard.transliteration`):**
              - Real-time Banglish-to-Bengali script conversion (`ami → আমি`, `tumi → তুমি`, `amar nam → আমার নাম`, `kemon acho → কেমন আছো`, `bhalo → ভালো`, `bangladesh → বাংলাদেশ`, `bhalobashi → ভালোবাসি`, `apni kemon achen → আপনি কেমন আছেন`, `suvash → সুভাষ`).
              - Context-sensitive standalone vowels (`অ আ ই ঈ উ ঊ ঋ এ ঐ ও ঔ`), dependent vowel signs/Kars (`া ি ী ু ূ ৃ ে ৈ ো ৌ`), aspirated & unaspirated consonants, conjuncts/Juktakkhor (`ক্ষ জ্ঞ ত্ত ন্দ ম্প স্ত স্থ প্র ত্র শ্র ক্র ব্র স্ন স্ম`), Hasanta (`্`), and Bengali digits (`০-৯`).
              - Incremental `InputConnection` composition (`setComposingText`, `commitText`, `finishComposingText`, `onUpdateSelection` cursor movement guard, and Backspace auto-commit undo).
            - **2. Intelligent 3–5 Candidate Suggestion Bar & Offline Personal Dictionary:**
              - Displays 3–5 ranked candidates directly above the keyboard (`ami → আমি | আমিই | আমির`, `bhalo → ভালো | ভাল | ভালোই`, `suvash → সুভাষ | সুবাশ | সুভাস`) plus contextual next-word predictions in both Bangla and English.
              - Offline Personal Dictionary (`Add`, `Edit`, `Delete`, `Reset`) and Custom Text Shortcuts (`brb → be right back`, `amar nam → আমার নাম সুভাষ`).
            - **3. Seamless Language Switching (`English ↔ বাংলা`):**
              - **Spacebar Horizontal Swipe** (`>= 42dp`) and **Dedicated Globe Key (`🌐 EN` / `🌐 বাং`)** with long-press Language Selection Menu and *Remember Last Used Language* support.
            - **4. Shared Premium Features in Both Languages:**
              - 8-icon top toolbar (`CV` app shortcut first, Emoji 8-category panel, Keyboard Settings, Clipboard History Quick Access, Text Editing Tools with Undo/Redo, `?123`, Theme cycler, More Options), 4 themes, 3 height presets, 4-level haptics, optional dedicated Number Row (`1–0 / ১–০`), and one-time onboarding.
            - **5. Comprehensive JUnit 4 Test Suite (`ClipboardArchitectureTest.kt`):**
              - Verified via `./gradlew testDebugUnitTest assembleDebug`.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
