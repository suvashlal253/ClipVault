name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.8
          name: "ClipVault v1.0.8 - Crisp Light Mode Overhaul, Enlarged Vault & Home Editor, Clear History Guard & Bug Fixes"
          body: |
            ### 🚀 ClipVault v1.0.8 Release (Build 9)

            Complete UI/UX enhancements, theme overhaul, and critical bug fixes in this release:
            - **1. Crisp Light Mode (White Version) Overhaul:** Upgraded Light Theme with clean `#F8F9FA` backgrounds, pure `#FFFFFF` card containers with soft elevation shadows, deep charcoal (`#1A1C1E`) primary text, dark slate (`#44474F`) secondary text, and high-contrast category badges while keeping the signature Dark Mode (`#0B0F19` / `#131B2E`) untouched.
            - **2. Enlarged & Unified Clip Editor (Home + Encrypted Vault):** Wide and tall multi-line `EditClipDialog` with live character/line counters, monospace code support, and seamless AES-256-GCM re-encryption inside Secure Vault.
            - **3. Clear All History Confirmation & Ghost Clip Fix:** Added warning confirmation dialog before wiping history, plus complete reset of ViewModel state (`_clearEpoch`), Room FTS4 index, and system `ClipboardManager` (`clearPrimaryClip()`) so the last copied clip never lingers or reappears.
            - **4. Position Lock & Explicit Trash Deletion:** Existing clips remain in their fixed positions when copied or edited (no erratic auto-jumping), and accidental swipe-to-delete gestures have been removed in favor of explicit trash-icon deletion.
            - **5. Redesigned Material 3 Dialogs & Android 14/15 Service Hardening:** Unified `SettingsDialog`, `AboutDeveloperDialog`, and `PrivacyDisclosureDialog` cards, `BootCompletedReceiver` auto-start support, FTS4 symbol search sanitization, and Android 14+ `FOREGROUND_SERVICE_TYPE_SPECIAL_USE` compliance.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
