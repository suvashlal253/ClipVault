name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests & Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.7.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.6.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.5.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.4.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.3.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.0
          name: "ClipVault v1.7.0 - Production Bilingual English + বাংলা Phonetic Keyboard Upgrade (20 Features & Architectural Fixes)"
          body: |
            ### 🚀 ClipVault v1.7.0 Release (Build 30)

            Complete Production-Ready Bilingual English + বাংলা (Bangla Phonetic) Keyboard & Clipboard Manager Upgrade:
            - **1. Architectural Fixes & Clean Keyboard UI:**
              - **Removed Duplicate Clipboard Manager UI from Keyboard:** Removed the redundant clipboard history toolbar button and in-keyboard clipboard history panel while preserving the **CV App Shortcut** icon and full background clipboard capture.
              - **Safe Keyboard-Managed Undo/Redo (`KeyboardUndoRedoManager`):** Replaced unreliable `performContextMenuAction(android.R.id.undo / redo)` with a bounded 30-step keyboard-managed Undo/Redo stack with editor-context verification, external-edit divergence guard, and password-field exclusion.
              - **Suggestion-First Auto-Correction Default:** Defaults to non-destructive suggestion bar display (`autoApplyOnSpace = false`) so English words are never aggressively replaced unless explicitly enabled.
              - **Personal Dictionary Starts Empty on Fresh Install:** Removed automatic demo seeding on first run while preserving existing v1.6.0 user-saved entries and adding live Search, Add, Edit, Delete, and Reset.
              - **About Developer Option in Both Layouts:** Added a visible `ⓘ` About button in the keyboard top toolbar across both English and বাংলা layouts that opens `MainActivity` and displays `AboutDeveloperDialog`.
              - **Configurable Release Signing:** `app/build.gradle.kts` now supports configurable release signing via `CLIPVAULT_KEYSTORE_PATH`, `CLIPVAULT_KEYSTORE_PASSWORD`, `CLIPVAULT_KEY_ALIAS`, and `CLIPVAULT_KEY_PASSWORD`.
            - **2. Upgraded Offline Bengali Phonetic Engine & Mixed-Language Intelligence:**
              - Strict 5-step matching hierarchy: (1) Exact personal dictionary entry, (2) Longest-match-first multi-word phrase shortcuts, (3) Single-word shortcuts, (4) General English/Banglish token classification, (5) Rule-based phonetic transliteration with bounded LRU caching.
              - Generates multi-candidate mixed-language sentences (e.g., `ami tomorrow office jabo` → `আমি tomorrow office যাব`, `আমি আগামীকাল অফিস যাব`, `আমি tomorrow অফিস যাব`).
            - **3. All 20 Requested Keyboard Features:**
              - Smart Word Prediction, Suggestion-First Auto Correction, Safe Undo/Redo, Dedicated Number Row (`1–0 / ১–০`), Bilingual Suggestions, One-Tap Language Switch, Offline Phonetic Engine, Personal Dictionary & Phrase Shortcuts, Mixed-Language Typing, About Option in Both Layouts, Smart Language Detection chip, Anchored Key Pop-up Preview, Sub-5ms Cached Responsiveness, Multi-Factor Suggestion Ranking, Bengali Unicode Font Styles, Key Size Presets (`Small / Medium / Large`), Safe `InputConnection` Crash Recovery, Fast Startup, TalkBack Accessibility & High-Contrast Mode, and One-Handed Mode (`Off / Left / Right`).
            - **4. Comprehensive JUnit 4 Test Suite (`ClipboardArchitectureTest.kt`):**
              - Verified via `./gradlew testDebugUnitTest assembleDebug`.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
