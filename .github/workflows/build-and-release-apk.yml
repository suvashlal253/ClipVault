name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.3
          name: "ClipVault v1.1.3 - Fix Rapid Copy Loss Bug (Mutex + Single-Thread FIFO Queue), Vault Scrollbar & Clean Cards"
          body: |
            ### 🚀 ClipVault v1.1.3 Release (Build 14)

            Critical concurrency fixes and UI enhancements in this release:
            - **1. Fix Rapid Copy Loss Bug (Mutex + Single-Thread Dispatcher + Unbounded FIFO Channel):**
              - `ClipboardForegroundService.kt` & `ClipboardAccessibilityService.kt` now snapshot `ClipboardManager.primaryClip` synchronously on the listener thread and enqueue every copied item into an unbounded FIFO `Channel<String>(Channel.UNLIMITED)` processed by `Dispatchers.IO.limitedParallelism(1)` + `Mutex`.
              - `ClipboardRepositoryImpl.saveNewClip()` serializes all Room DB writes under `insertMutex.withLock` on a dedicated single-thread write dispatcher with a monotonically increasing `createdAt` timestamp (`AtomicLong`) so rapid back-to-back copies never race, collide, or overwrite intermediate items.
              - `ClipboardViewModel.kt` queues `SaveNewClip` intents in an unbounded FIFO `Channel` so rapid foreground copies are processed sequentially in exact copy order.
            - **2. Smooth Vertical Scrollbar & Fast-Scroller in Secure Vault:** Includes pixel-accurate `drawVerticalScrollbar` and animated **"Top"** pill button inside `VaultScreen.kt`.
            - **3. Clean Unified EMAIL & URL Cards & Default Home Dashboard:** Standard card borders, high-contrast `onSurface` text, neutral action buttons, and zero unwanted auto-vaulting of Bengali text.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
