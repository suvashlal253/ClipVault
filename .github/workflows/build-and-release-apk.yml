name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "ClipVault v1.2.0 - Cloud Backup & Restore (Google Drive), Quick Settings Tile, Custom Tags, Search Highlighting & Batch Operations"
          body: |
            ### 🚀 ClipVault v1.2.0 Release (Build 15)

            5 Pro Utility Features & Architectural Upgrades in this release:
            - **1. Cloud Backup & Restore (Google Drive & Encrypted JSON Sync):**
              - Backup your entire Room SQLite clipboard history (including custom tags, pinned status, and AES-256 Vault items) directly to **Google Drive** or local storage as a portable `ClipVault-Backup-YYYY-MM-DD.json` file via Android Storage Access Framework (`CreateDocument` / `OpenDocument`), and seamlessly restore/merge on any device.
            - **2. Quick Settings Tile (Notification Bar Shortcut):**
              - `ClipCaptureTileService` lets you place a 1-tap **ClipVault** tile in your Android Quick Settings notification drawer to instantly capture the current clipboard and launch ClipVault from anywhere.
            - **3. Custom Tags & Categories (`#Office`, `#Personal`, `#Study`, `+ Tag`):**
              - Create custom user-defined tags, assign multiple tags to any clip card, and filter clips with dedicated visual tag chips alongside system categories.
            - **4. Dynamic Search Keyword Highlighting:**
              - Real-time `AnnotatedString` + `SpanStyle` search highlighting inside both Home and Secure Vault screens highlights matching keywords with high-contrast amber-yellow markers.
            - **5. Multi-Selection & Batch Operations:**
              - Long-press any clip card to enter Multi-Selection Mode with a contextual batch action bar supporting **Select All**, **Batch Assign Custom Tag**, **Batch Move to Secure Vault**, **Batch Share/Export**, and **Batch Delete**.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
