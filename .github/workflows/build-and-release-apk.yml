name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.2.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.1
          name: "ClipVault v1.2.1 - Mutex-Locked Sequential ClipboardServiceHelper & Zero Rapid Copy Loss"
          body: |
            ### 🚀 ClipVault v1.2.1 Release (Build 16)

            Critical Bug Fixes & Concurrency Architecture Upgrades in this release:
            - **1. `ClipboardServiceHelper` Mutex-Locked Sequential Insertion:**
              - Implemented `ClipboardServiceHelper` powered by `CoroutineScope(Dispatchers.IO + SupervisorJob())` and `Mutex.withLock` so rapid consecutive copy bursts are queued and persisted into Room SQLite strictly in sequential order with zero intermediate clip loss.
            - **2. Synchronous Consecutive Duplicate Guard (`lastCopiedText`):**
              - Filters out duplicate consecutive OS `OnPrimaryClipChangedListener` callbacks synchronously on the caller thread while allowing every distinct rapid copy (`EMAIL`, `URL`, `CODE`, `TEXT`) to enter the Mutex queue immediately.
            - **3. Strict Home Dashboard Default (`isVaulted = false`):**
              - All copied items (English, Bengali, URLs, Emails, OTPs) are saved strictly to the Home Dashboard by default and never auto-vaulted without explicit user action.
            - **4. Includes All v1.2.0 Pro Utility Features:**
              - Cloud Backup & Restore (Google Drive / JSON), Quick Settings Tile, Custom Tags (`#Office`, `#Personal`, `#Study`), Dynamic Search Keyword Highlighting, and Multi-Selection Batch Operations.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
