name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "ClipVault v1.1.0 - Fix Bengali Text Auto-Vaulting, Default Home Dashboard Insertion & Manual Vault Control"
          body: |
            ### 🚀 ClipVault v1.1.0 Release (Build 11)

            Critical fixes and enhancements in this release:
            - **1. Fix Unwanted Auto-Vaulting of Bengali Text:** Updated `ClipClassifier.kt` so Bengali / Unicode scripts and multi-word sentences are never misclassified as `SENSITIVE` by Shannon entropy. All Bengali text is accurately categorized as `TEXT`.
            - **2. Default Home Dashboard Behavior:** Updated `ClipboardRepository.saveNewClip()` and `ClipboardAccessibilityService.kt` so all newly copied items (English, Bengali, URLs, Emails, OTPs, etc.) are saved strictly to the main Home Dashboard by default (`isVaulted = false`).
            - **3. Explicit Manual Vault Control:** Newly copied clips never bypass the Home Dashboard on their own; items only move into or out of the encrypted Secure Vault when the user explicitly taps the Lock/Vault icon on a clip card (`toggleVault`).
            - **4. Official Custom Launcher Icon & Smart EMAIL Badge:** Includes multi-density custom launcher icons (`mipmap-mdpi` to `mipmap-xxxhdpi`) and Coral-Rose `EMAIL` detection badge.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
