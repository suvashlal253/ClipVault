name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Build & Release ClipVault v1.7.3 (Build 33)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests & Build Debug APK (Testing Only)
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          mkdir -p debug-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk debug-artifacts/ClipVault-v1.7.3-debug.apk
          echo "Debug APK prepared for CI testing: $(ls -lh debug-artifacts)"

      - name: Upload Debug APK Artifact (Testing Only)
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-v1.7.3-Debug-APK
          path: debug-artifacts/ClipVault-v1.7.3-debug.apk
          retention-days: 30

      - name: Prepare Release Signing Keystore & Build Signed Release APK + AAB
        id: release_build
        env:
          KEYSTORE_B64: ${{ secrets.CLIPVAULT_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.CLIPVAULT_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.CLIPVAULT_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.CLIPVAULT_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/clipvault-release.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            export CLIPVAULT_KEYSTORE_PATH="$KEYSTORE_FILE"
            export CLIPVAULT_KEYSTORE_PASSWORD="$SECRET_STORE_PASS"
            export CLIPVAULT_KEY_ALIAS="$SECRET_KEY_ALIAS"
            export CLIPVAULT_KEY_PASSWORD="$SECRET_KEY_PASS"
            echo "signing_source=GitHub Secrets Production Keystore" >> "$GITHUB_OUTPUT"
            echo "Production signing credentials detected in GitHub Secrets."
          else
            echo "NOTICE: Custom repository signing secrets not found; generating RSA-2048 release keystore in RUNNER_TEMP so assembleRelease & bundleRelease produce signed v1.7.3 release artifacts."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias clipvault_release \
              -storepass "ClipVaultRelease2026!" \
              -keypass "ClipVaultRelease2026!" \
              -dname "CN=Suvash Purkaystha, OU=ClipVault Android, O=ClipVault, L=Sylhet, S=Sylhet, C=BD"
            export CLIPVAULT_KEYSTORE_PATH="$KEYSTORE_FILE"
            export CLIPVAULT_KEYSTORE_PASSWORD="ClipVaultRelease2026!"
            export CLIPVAULT_KEY_ALIAS="clipvault_release"
            export CLIPVAULT_KEY_PASSWORD="ClipVaultRelease2026!"
            echo "signing_source=CI-Provisioned RSA-2048 Release Keystore" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew assembleRelease bundleRelease --stacktrace
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/ClipVault-v1.7.3.apk
          cp app/build/outputs/apk/release/app-release.apk release-assets/ClipVault-v1.7.3-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release-assets/ClipVault-v1.7.3-release.aab
          cp debug-artifacts/ClipVault-v1.7.3-debug.apk release-assets/ClipVault-v1.7.3-debug.apk
          rm -f "$KEYSTORE_FILE"
          echo "Signed release artifacts prepared: $(ls -lh release-assets)"

      - name: Upload Signed Release APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-v1.7.3-Signed-Release-Assets
          path: release-assets/*
          retention-days: 90

      - name: Publish GitHub Release (v1.7.3)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.3
          name: "ClipVault v1.7.3 — Critical Bug Fixes, Bengali Keyboard Enhancement & Final UI Polish (Build 33)"
          body: |
            ## 🛡️ ClipVault v1.7.3 — Critical Bug Fixes, Bengali Keyboard Enhancement & Final UI Polish (Build 33)

            ### 📦 Downloadable Release Assets
            - **`ClipVault-v1.7.3.apk`** / **`ClipVault-v1.7.3-release.apk`** — Signed, R8-minified production release APK (`./gradlew assembleRelease`, signed via ${{ steps.release_build.outputs.signing_source }})
            - **`ClipVault-v1.7.3-release.aab`** — Signed Android App Bundle for Google Play Store distribution (`./gradlew bundleRelease`)
            - **`ClipVault-v1.7.3-debug.apk`** — Debug testing APK (`./gradlew assembleDebug`)

            ---

            ### ✨ What's New & Fixed in v1.7.3 (Build 33)
            1. **Final Keyboard UI Polish & Visual Consistency (`ClipVaultInputMethodService.kt`):**
               - Standardized key shapes, `8dp` corner radius, `1dp` hairline borders (`2dp` high-contrast), `4dp` inter-key & inter-row spacing, uniform `34dp` 7-action toolbar buttons, and `34dp` suggestion chips with single-line ellipsis & `56%` max-width protection for long Bengali words.
               - Refined Dark Charcoal, Pure Black, and Light theme palettes, balanced Row-3/Row-4 special key weights (`?123`, `🌐 বাং`, `,`, Spacebar, `।`, `↵`), and added responsive Row-2 insets across small/standard/large screens and One-Handed mode.
            2. **Prevent Duplicate Clipboard Content (`ClipboardContentNormalizer` + Room `MIGRATION_1_2`):**
               - Eliminates duplicate clipboard entries when copying from ClipVault itself or copying identical text twice from external apps using Unicode NFC normalization, consistent line endings, indexed SHA-256 `content_hash` lookup with exact content verification, and short-lived app-originated copy fingerprinting.
            3. **Bengali Keyboard Numeric Row (`১ ২ ৩ ৪ ৫ ৬ ৭ ৮ ৯ ০`):**
               - Selecting **বাংলা** mode immediately updates the dedicated numeric row, top-row secondary digit hints, and Symbol Page 1 top row to `১ ২ ৩ ৪ ৫ ৬ ৭ ৮ ৯ ০`; switching to **EN** mode restores `1 2 3 4 5 6 7 8 9 0`.
            4. **Avro-Grade Bengali Phonetic Transliteration Engine (450+ Lexicon + 18 Complex Conjuncts):**
               - Accurately transliterates `bektigoto` → `ব্যক্তিগত`, `bidyut` → `বিদ্যুৎ`, `krishi` → `কৃষি`, `chad` → `চাঁদ`, `utshob` → `উৎসব`, `ha`/`haa` → `হ্যাঁ`, `valo`/`bhalo` → `ভালো`, `korsi` → `করছি`, `facebook` → `ফেসবুক`, `bkash` → `বিকাশ`, `onko` → `অঙ্ক`, `bakko` → `বাক্য`, `purkaystha` → `পুরকায়স্থ`, `dhormo` → `ধর্ম`, and all 18 complex conjuncts.
            5. **Multiline Enter Key Fix for WhatsApp, Messenger, Gemini & Notes:**
               - Inspects `TYPE_TEXT_FLAG_MULTI_LINE`, `TYPE_TEXT_FLAG_IME_MULTI_LINE`, and `IME_FLAG_NO_ENTER_ACTION` so pressing Enter in multiline chat/note fields inserts a newline (`\n`) and keeps the keyboard open.
            6. **Clipboard Toolbar Icon, Duplicate About Removal, Keyboard Picker Name, Punctuation & Undo/Redo:**
               - Uses `ic_content_copy` vector icon in toolbar, removes duplicate `ⓘ` button from top bar, sets keyboard picker name to **ClipVault Keyboard** (**English (US)** / **বাংলা**), preserves punctuation in mixed sentences, and restores cursor/selection on Undo/Redo.
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
