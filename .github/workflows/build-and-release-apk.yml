name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "ClipVault v1.0.6 - Premium Dark Theme, Smart Category Color Coding & All Critical Bug Fixes"
          body: |
            ### 🚀 ClipVault v1.0.6 Release

            Key functional fixes and visual upgrades in this release:
            - **1. Premium Dark-Mode Aesthetic & Vibrant Accents:** Configured Midnight Slate background (`#0B0F19`), clean elevated dark cards (`#131B2E`), and rich Indigo/Blue-Purple (`#6366F1` / `#4F46E5`) active filter tabs and toggle switches.
            - **2. Smart Category Color Coding:** Distinct visual badges for every clipboard type — Warm Orange/Amber (`#F59E0B`) for `OTP`, Emerald Green (`#10B981`) for `Code`, Electric Cyan (`#38BDF8`) for `URL`, Vivid Pink/Magenta (`#EC4899`) for `Color`, and Soft Indigo/Teal for `Email` & `Phone`.
            - **3. Elegant Dialogs & High-Contrast Buttons:** Styled Privacy & Consent, Settings, and Clip Editor modals with dark surface cards and solid high-contrast Emerald Green (`#10B981`) and Indigo (`#6366F1`) primary action buttons.
            - **4. Consistent Typography, 12-Hour AM/PM & Search Bar LTR Fix:** All timestamps use 12-hour AM/PM format (`MMM d, h:mm a`), and search inputs enforce strict `TextDirection.Ltr` with local state buffering to prevent cursor jumps.
            - **5. Duplicate Prevention, Quick Edit, Date Filter & Complete History Wipe:** Prevents duplicate database entries, supports inline clip editing, past date calendar filtering, and clean history clearing.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
