name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "ClipVault v1.0.3 - Biometric Vault & Foreground Auto-Capture Release"
          body: |
            ### 🚀 ClipVault v1.0.3 Release
            
            Key functional fixes and improvements:
            - **Dropped Accessibility Dependency:** Replaced strict AccessibilityService dependency with a lightweight, background `ClipboardForegroundService` with notification action and instant foreground window focus sync. Fully compatible with Samsung One UI and Android 13/14/15.
            - **Biometric Secure Vault:** Fully working `BiometricPrompt` authentication (fingerprint, face, and device PIN/pattern fallback) that unlocks and navigates to the dedicated encrypted AES-256 `VaultScreen`.
            - **Interactive Settings Dialog:** Connected settings for toggling background clipboard monitoring, biometric protection, clearing unpinned clips, and exporting clips via Android share sheet.
            - **Material 3 Dynamic Theme:** `ClipVaultTheme` seamlessly toggling between Dark and Light mode based on `isSystemInDarkTheme()`.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
