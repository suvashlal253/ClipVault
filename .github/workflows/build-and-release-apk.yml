name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.1
          name: "ClipVault v1.1.1 - Clean Unified EMAIL & URL Card Styling, Standard Text Contrast & Uniform Action Buttons"
          body: |
            ### 🚀 ClipVault v1.1.1 Release (Build 12)

            UI/UX card refinements and functional fixes in this release:
            - **1. Remove Special Card Borders on EMAIL & URL Cards:** `EMAIL` and `URL` cards now share the exact same clean surface and border styling as standard text cards.
            - **2. Standard High-Contrast Text Color:** Copied email addresses and URLs inside cards now render using the standard `MaterialTheme.colorScheme.onSurface` text color instead of red or blue highlights.
            - **3. Uniform Action Buttons (`Email` & `Open Link`):** Contextual action buttons inside `EMAIL`, `URL`, and `PHONE` cards now use a clean, neutral outlined button style matching the surrounding action tools.
            - **4. Default Home Dashboard & Bengali Text Fix:** All newly copied clips (including Bengali text) save strictly to the Home Dashboard by default and only move to the Secure Vault when manually locked.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
