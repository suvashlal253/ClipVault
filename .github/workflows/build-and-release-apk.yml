name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "ClipVault v1.0.1 - Bugfix Release"
          body: |
            ### 🚀 ClipVault v1.0.1 Release
            
            Fixed critical issues reported in compiled APK:
            - **Fixed String Interpolation:** Dynamic evaluation of clip counts (`All (count)`) and search query labels.
            - **Fully Responsive UI & Dialogs:** Wired **About Developer** (Suvash Purkaystha) profile modal, **Privacy Policy** dialog, and **Accessibility Settings** shortcut.
            - **Reactive Room DB & StateFlow:** Eager StateFlow emission preventing empty-state deadlocks.
            - **Background Auto-Capture Banner:** Top indicator prompting user to enable Accessibility Service with one-tap system settings intent.
            - **Quick Add / Paste:** Floating Action Button (`+`) for instant manual entry or clipboard sync.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
