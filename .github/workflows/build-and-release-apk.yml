name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.2
          name: "ClipVault v1.1.2 - Smooth Vertical Scrollbar & Fast-Scroller in Secure Vault, Clean EMAIL/URL Cards & Bengali Fix"
          body: |
            ### 🚀 ClipVault v1.1.2 Release (Build 13)

            New UI/UX enhancements and fixes in this release:
            - **1. Smooth Vertical Scrollbar & Fast-Scroller in Secure Vault:** Added `drawVerticalScrollbar(vaultListState)` with pixel-accurate sub-item interpolation, bounded `weight(1f)` `LazyColumn` physics, and an animated **"Top"** fast-scroll button inside `VaultScreen.kt`.
            - **2. Clean Unified EMAIL & URL Card Styling:** Removed special colored card borders, updated body text to use high-contrast `MaterialTheme.colorScheme.onSurface`, and standardized contextual action buttons (`Email`, `Open Link`, `Dial`) to match surrounding tool icons.
            - **3. Default Home Dashboard & Bengali Text Fix:** All newly copied clips (including Bengali text) save strictly to the Home Dashboard by default and only move to the Secure Vault when manually locked.
            - **4. Official Custom Launcher Icon:** Includes multi-density custom launcher icons (`mipmap-mdpi` to `mipmap-xxxhdpi`).
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
