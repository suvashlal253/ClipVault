name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "ClipVault v1.0.4 - Deep Navy Secure Vault, Zero-Copy Fix & Background Auto-Capture"
          body: |
            ### 🚀 ClipVault v1.0.4 Release

            Key functional fixes and improvements in this build:
            - **Reliable Background Auto-Capture (Android 10+):** Implemented a persistent `ClipboardForegroundService` with a low-overhead, translucent 1-pixel `ClipSyncTrampolineActivity` that gains instantaneous window focus to read the system clipboard without triggering Android 10+ background restriction blocks. Added status bar notification with instant "Sync Clip Now" action.
            - **Distinct Deep-Navy Secure Vault UI:** Completely redesigned the Encrypted Vault screen with a high-security midnight navy theme (`#090D16`), glowing emerald AES-256-GCM hardware Keystore badge, in-vault search bar, password masking toggle (eye icon), and prominent back navigation header with hardware `BackHandler` integration.
            - **Fixed Auto-Copy on Vault Entry:** Guaranteed zero clipboard write events on VaultScreen initialization or composition. Added strict screen state guards in `MainActivity` to ensure opening or viewing the Secure Vault never re-copies previous items or pollutes the system clipboard.
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
