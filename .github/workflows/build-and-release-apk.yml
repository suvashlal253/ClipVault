name: Build & Release ClipVault APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace


      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ClipVault-v1.0.0.apk
          echo "APK prepared successfully: $(ls -lh release-assets)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "ClipVault v1.0.2 - Dynamic Material 3 Theme & Accessibility Quick-Enable"
          body: |
            ### 🚀 ClipVault v1.0.2 Release
            
            New features and bug fixes:
            - **Material 3 Dynamic Dark/Light Theme:** Added full `ClipVaultTheme` with automatic system dark mode detection (`isSystemInDarkTheme()`), Android 12+ wallpaper dynamic palette support, and transparent edge-to-edge system bars.
            - **Accessibility Auto-Capture Quick-Enable:** Clicking "Enable" on the Accessibility Banner directly launches device Accessibility Settings with fallback protection.
            - **Dynamic String Interpolation:** Real-time evaluation of clip counts (`All (count)`) and search query labels.
            - **Interactive Dialogs & Shortcuts:** Complete wired **About Developer** (Suvash Purkaystha), **Privacy Policy**, and **Floating Action Button** (`+ New Clip`).
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
